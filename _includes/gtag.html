{% if site.gtag %}
{% assign analytics_area = site.analytics_area | default: "blog" %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.gtag }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('set', 'linker', {'domains': ['paulorobertoelias.com.br']});
  gtag('js', new Date());
  gtag('config', '{{ site.gtag }}', {'content_group': '{{ analytics_area }}'});
</script>
{% endif %}
